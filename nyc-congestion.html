<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC Congestion Website — Trevor Foster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f1b2b;
    --panel: #16273a;
    --panel-line: #2a3f56;
    --text: #e7ecf1;
    --muted: #8ea0b5;
    --amber: #e8a23d;
    --teal: #5fb3ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(232, 162, 61, 0.07), transparent 42%),
      radial-gradient(circle at 88% 78%, rgba(95, 179, 172, 0.08), transparent 45%),
      radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px);
    background-size: auto, auto, 26px 26px;
    background-position: 0 0, 0 0, -1px -1px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 72px 28px 96px;
  }
  .back {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--teal);
    text-decoration: none;
    margin-bottom: 40px;
    border-bottom: 1px solid transparent;
  }
  .back:hover, .back:focus-visible { border-bottom-color: var(--teal); }
  .when {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin-bottom: 12px;
  }
  h1 {
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.15;
    font-weight: 600;
    margin: 0 0 28px;
    letter-spacing: -0.01em;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    padding: 24px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
  }
  @media (max-width: 600px) {
    .page { padding: 48px 20px 64px; }
  }
</style>
</head>
<body>
  <div class="page">
    <a class="back" href="who-am-i.html">&larr; back to who am i</a>
    <span class="when">Duke</span>
    <h1>NYC Congestion Website</h1>
    <div class="panel">
      Project details coming soon — swap this placeholder for a full writeup, photos, or a demo video.
    </div>
  </div>
</body>
</html>
